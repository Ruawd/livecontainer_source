name: Update LiveContainer source

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-livecontainer-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update apps.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_source.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Source is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json assets/icons
          git commit -m "chore: update app releases"
          git push
